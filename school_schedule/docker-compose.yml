name: school_schedule

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - school_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: >-
      sh -c 'python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 --workers 3
      --access-logfile - --error-logfile -
      school_schedule.wsgi:application'
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - cities_light_data:/app/data/cities_light
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - school_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["python", "bot.py"]
    volumes:
      - .:/app
      - cities_light_data:/app/data/cities_light
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - school_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - school_net

volumes:
  postgres_data:
  static_volume:
  media_volume:
  cities_light_data:

networks:
  school_net:
    driver: bridge
